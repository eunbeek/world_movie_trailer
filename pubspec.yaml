name: world_movie_trailer
description: "A new Flutter project."
publish_to: 'none'

version: 1.3.0+70

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2                    # Latest stable version for HTTP requests
  html: ^0.15.0                    # For working with HTML content
  intl: ^0.19.0                    # For internationalization and formatting
  cupertino_icons: ^1.0.6          # iOS-style icons for your app
  firebase_core: ^3.5.0          
  firebase_storage: ^12.1.3        
  youtube_player_flutter: ^9.1.0   
  hive: ^2.2.3                    
  hive_flutter: ^1.1.0          
  provider: ^6.0.0
  url_launcher: ^6.3.0
  simple_animations: ^5.0.2 
  video_player: ^2.5.1  
  chewie: ^1.3.4     
  share_plus: ^10.0.2
  google_mobile_ads: ^5.1.0
  amplitude_flutter: ^3.9.0
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^18.0.1
  better_player: ^0.0.84
  permission_handler: ^10.0.0
  in_app_purchase: ^3.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.0.0
  flutter_launcher_icons: ^0.14.1
flutter_icons:
  android: true
  ios: true
  image_path_android: "icons/playstore.png"
  image_path_ios: "icons/appstore.png"
  adaptive_icon_background: "#ffffff"
