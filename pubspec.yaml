name: world_movie_trailer
description: "A new Flutter project."
publish_to: 'none'

version: 2.0.0+88

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2                    # Latest stable version for HTTP requests
  html: ^0.15.0                    # For working with HTML content
  intl: ^0.19.0                    # For internationalization and formatting
  cupertino_icons: ^1.0.6          # iOS-style icons for your app
  firebase_core: ^3.5.0          
  firebase_storage: ^12.1.3        
  youtube_player_flutter: ^9.0.0
  youtube_player_iframe: ^5.2.1
  hive: ^2.2.3                    
  hive_flutter: ^1.1.0          
  provider: ^6.0.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.2
  google_mobile_ads: ^5.3.1
  amplitude_flutter: ^3.16.7
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  flutter_local_notifications: ^19.3.0
  timezone: ^0.10.1
  permission_handler: ^11.3.1
  in_app_purchase: ^3.3.0
  uuid: ^4.4.2
  webview_flutter_wkwebview: ^3.26.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.0.0
  flutter_launcher_icons: ^0.14.1
flutter_icons:
  android: true
  ios: true
  image_path_android: "icons/playstore.png"
  image_path_ios: "icons/appstore.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "icons/playstore.png"
