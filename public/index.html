<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Management</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .tabs {
      display: flex;
      justify-content: center;
      background-color: #f4f4f4;
      padding: 10px;
    }

    .tab-button {
      padding: 10px 20px;
      cursor: pointer;
      border: none;
      background-color: #ddd;
      margin: 0 5px;
      font-size: 16px;
    }

    .tab-button.active {
      background-color: #4CAF50;
      color: white;
    }

    .tab-content {
      display: none;
      padding: 20px;
    }

    .tab-content.active {
      display: block;
    }

    #moviesTable {
      width: 80%;
      margin: 20px auto;
      border-collapse: collapse;
      border: 1px solid #ccc;
    }

    #moviesTable th, #moviesTable td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }

    #moviesTable th {
      background-color: #f4f4f4;
    }

    select {
      padding: 10px;
      margin: 20px 0;
    }

    .update-button, .delete-button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
    }

    .delete-button {
      background-color: #f44336;
    }
    #loading, .loading {
      display: none;
      font-size: 20px;
      color: #555;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- 탭 버튼 -->
  <div class="tabs">
    <button class="tab-button active" onclick="openTab('moviesTab')">Movie List</button>
    <button class="tab-button" onclick="openTab('promotinoTab')">Promotion</button>
  </div>

  <!-- Movie List Tab -->
  <div id="moviesTab" class="tab-content active">
    <h1>Movie List by Country</h1>

    <label for="countryDropdown">Select a Country:</label>
    <select id="countryDropdown">
      <option value="">-- Select a Country --</option>
      <option value="special">Special</option>
      <option value="us">United States</option>
      <option value="th">Thailand</option>
      <option value="tw">Taiwan</option>
      <option value="ca">Canada</option>
      <option value="cn">China</option>
      <option value="au">Australia</option>
      <option value="fr">France</option>
      <option value="es">Spain</option>
      <option value="de">Germany</option>
      <option value="kr">South Korea</option>
      <option value="jp">Japan</option>
      <option value="in">India</option>
    </select>

    <p id="loading">Loading movies...</p>
    <table id="moviesTable" style="display:none;">
      <thead>
        <tr>
          <th>Title</th>
          <th>Release Date</th>
          <th>Trailer Url</th>
          <th>Update</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody id="moviesTableBody">
      </tbody>
    </table>
  </div>

  <!-- Promotion Tab -->
  <div id="promotinoTab" class="tab-content">
    <h1>Promotion APPs</h1>
    <input type="text" id="newUrl" placeholder="Enter new promotion URL" />
    <button onclick="updatePromotionUrl()">Update URL</button>

    <h2>Current Promotion URL:</h2>
    <div id="promotionUrlContainer">
    </div>
  </div>

  <script>
    function openTab(tabId) {
      const tabs = document.querySelectorAll('.tab-content');
      const buttons = document.querySelectorAll('.tab-button');

      tabs.forEach(tab => tab.classList.remove('active'));
      buttons.forEach(button => button.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      document.querySelector(`[onclick="openTab('${tabId}')"]`).classList.add('active');
    }

    const dropdown = document.getElementById('countryDropdown');
    const loading = document.getElementById('loading');
    const moviesTable = document.getElementById('moviesTable');
    const moviesTableBody = document.getElementById('moviesTableBody');

    async function fetchMoviesByCountry(selectedCountry) {
      moviesTable.style.display = 'none';
      loading.style.display = 'block';
      moviesTableBody.innerHTML = ''; // 기존 데이터 초기화

      try {
        const response = await fetch(
          `https://us-central1-world-movie-trailer.cloudfunctions.net/readMovieListByCountry?country=${selectedCountry}`
        );
        const data = await response.json();

        console.log('Fetched data:', data); // 디버깅 로그 추가

        if (data.success && data.movies.length > 0) {
          renderMovies(data.movies, selectedCountry);
          moviesTable.style.display = 'table';
        } else {
          moviesTableBody.innerHTML = ''; // 테이블 초기화 (불필요한 `''` 방지)
          moviesTable.style.display = 'none'; // 영화 없으면 테이블 숨김
        }
      } catch (error) {
        alert('Error loading movies. Please try again.');
        console.error('Error fetching movies:', error);
      } finally {
        loading.style.display = 'none'; // 항상 로딩 메시지 숨김
      }
    }

    function renderMovies(movies, selectedCountry) {
      moviesTableBody.innerHTML = '';
      movies.forEach(movie => {
        if (movie.localTitle && movie.localTitle.trim() !== '') {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${movie.localTitle}</td>
            <td>${movie.releaseDate || 'Unknown'}</td>
            <td>${movie.trailerUrl || ''}</td>
            <td>
              <button class="update-button" onclick="toggleExpandRow(this, '${movie.localTitle}', '${movie.trailerUrl || ''}', '${selectedCountry}')">Details</button>
              <span class="action-loading" id="update-loading-${movie.localTitle}" style="display: none;">Loading...</span>
            </td>
            <td>
              <button class="delete-button" onclick="deleteMovie('${movie.localTitle}', '${selectedCountry}', this)">Delete</button>
              <span class="action-loading" id="delete-loading-${movie.localTitle}" style="display: none;">Loading...</span>
            </td>
          `;
          moviesTableBody.appendChild(row);
        }
      });
    }

    async function deleteMovie(title, country) {
      const confirmation = confirm(`Are you sure you want to delete "${title}"?`);
      if (!confirmation) return;

      try {
        const response = await fetch(
          'https://us-central1-world-movie-trailer.cloudfunctions.net/deleteMovieByManual',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ country: country.toLowerCase(), title }),
          }
        );
        const result = await response.json();

        if (result.success) {
          alert(`"${title}" deleted successfully!`);
          await fetchMoviesByCountry(country);
        } else {
          alert(`Failed to delete "${title}".`);
        }
      } catch (error) {
        console.error('Error deleting movie:', error);
        alert('An error occurred while deleting the movie.');
      }
    }

        // Update trailer URL
        async function updateTrailer(title, country) {
      const trailerInput = document.getElementById(`trailer-${title}`);
      const newTrailerUrl = trailerInput.value;

      if (!newTrailerUrl) {
        alert('Please enter a valid trailer URL.');
        return;
      }

      const loadingIndicator = document.getElementById(`update-loading-${title}`);
      loadingIndicator.style.display = 'inline';

      try {
        const response = await fetch(
          'https://us-central1-world-movie-trailer.cloudfunctions.net/updateMovieTrailer',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ country: country.toLowerCase(), title, newTrailerUrl }),
          }
        );
        const result = await response.json();
        loadingIndicator.style.display = 'none';

        if (result.success) {
          alert(`Trailer URL for "${title}" updated successfully!`);
          await fetchMoviesByCountry(country); // Refresh movie list
        } else {
          alert(`Failed to update trailer URL for "${title}".`);
        }
      } catch (error) {
        loadingIndicator.style.display = 'none';
        console.error('Error updating trailer URL:', error);
        alert('An error occurred while updating the trailer URL.');
      }
    }

    // Toggle expand row for trailer update
    function toggleExpandRow(button, title, trailerUrl, country) {
      const row = button.closest('tr');
      const nextRow = row.nextElementSibling;

      if (nextRow && nextRow.classList.contains('expand-row')) {
        nextRow.remove(); // Remove expanded row if it exists
        return;
      }

      const expandRow = document.createElement('tr');
      expandRow.className = 'expand-row';
      expandRow.innerHTML = `
        <td colspan="5">
          <label for="trailer-${title}">Trailer URL:</label>
          <input type="text" id="trailer-${title}" value="${trailerUrl}" style="width: 60%; padding: 5px;" />
          <button class="update-button" onclick="updateTrailer('${title}', '${country}')">Update Trailer</button>
        </td>
      `;
      row.after(expandRow);
    }
    dropdown.addEventListener('change', () => {
      const selectedCountry = dropdown.value;
      if (selectedCountry) {
        fetchMoviesByCountry(selectedCountry);
      } else {
        moviesTable.style.display = 'none';
        moviesTableBody.innerHTML = '';
      }
    });

    // Update the Promotion URL
    async function updatePromotionUrl() {
      const newUrl = document.getElementById('newUrl').value;
      if (!newUrl) {
          alert('Please enter a valid URL');
          return;
      }

      try {
          const response = await fetch('https://us-central1-world-movie-trailer.cloudfunctions.net/updatePromotionUrl', {
              method: 'POST',
              headers: {
                  'Content-Type': 'application/json',
              },
              body: JSON.stringify({ newUrl: newUrl }),
          });

          if (response.ok) {
              alert('Promotion URL updated successfully');
              getPromotionUrl(); // Refresh the displayed URL after update
          } else {
              alert('Error updating URL');
          }
      } catch (error) {
          console.error('Error:', error);
          alert('Error updating URL');
      }
    }

    // Get the current Promotion URL when the page loads
    async function getPromotionUrl() {
      try {
          const response = await fetch('https://us-central1-world-movie-trailer.cloudfunctions.net/readPromotionUrl');
          
          if (response.ok) {
              const data = await response.json();
              const promotionUrl = data.url; // Assuming the response contains the URL in a field called 'url'
              document.getElementById('promotionUrlContainer').innerHTML = `<a href="${promotionUrl}" target="_blank">${promotionUrl}</a>`;
          } else {
              console.error('Error fetching Promotion URL');
              document.getElementById('promotionUrlContainer').innerText = 'Failed to load promotion URL.';
          }
      } catch (error) {
          console.error('Error:', error);
          document.getElementById('promotionUrlContainer').innerText = 'Failed to load promotion URL.';
      }
    }

    // Load the current Promotion URL when the page is loaded
    window.onload = getPromotionUrl;
  </script>
</body>
</html>
