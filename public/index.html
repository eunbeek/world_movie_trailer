<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie List</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      text-align: center;
    }
    #loading, .loading {
      display: none;
      font-size: 20px;
      color: #555;
      margin-top: 20px;
    }
    #moviesTable {
      width: 80%;
      margin: 20px auto;
      border-collapse: collapse;
      border: 1px solid #ccc;
    }
    #moviesTable th, #moviesTable td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: center;
    }
    #moviesTable th {
      background-color: #f4f4f4;
    }
    select {
      padding: 10px;
      margin: 20px 0;
    }
    .expand-row {
      background-color: #f9f9f9;
    }
    .expand-row td {
      text-align: left;
    }
    .update-button, .delete-button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
    }
    .delete-button {
      background-color: #f44336;
    }
    .action-loading {
      display: inline-block;
      margin-left: 10px;
      color: #555;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>Movie List by Country</h1>
  
  <label for="countryDropdown">Select a Country:</label>
  <select id="countryDropdown">
    <option value="">-- Select a Country --</option>
    <option value="kr-test">test korea</option>
    <option value="th-test">test thailand</option>
    <option value="us">United States</option>
    <option value="th">Thailand</option>
    <option value="tw">Taiwan</option>
    <option value="ca">Canada</option>
    <option value="cn">China</option>
    <option value="au">Australia</option>
    <option value="fr">France</option>
    <option value="es">Spain</option>
    <option value="de">Germany</option>
    <option value="kr">South Korea</option>
    <option value="jp">Japan</option>
    <option value="in">India</option>
  </select>

  <p id="loading">Loading movies...</p>
  <table id="moviesTable" style="display:none;">
    <thead>
      <tr>
        <th>Title</th>
        <th>Release Date</th>
        <th>Trailer Url</th>
        <th>Update</th>
        <th>Delete</th>
      </tr>
    </thead>
    <tbody id="moviesTableBody">
    </tbody>
  </table>

  <script>
    const dropdown = document.getElementById('countryDropdown');
    const loading = document.getElementById('loading');
    const moviesTable = document.getElementById('moviesTable');
    const moviesTableBody = document.getElementById('moviesTableBody');

    // Fetch and render movies for a specific country
    async function fetchMoviesByCountry(selectedCountry) {
      moviesTable.style.display = 'none';
      loading.style.display = 'block';
      moviesTableBody.innerHTML = ''; // Clear previous rows

      try {
        const response = await fetch(
          `https://us-central1-world-movie-trailer.cloudfunctions.net/readMovieListByCountry?country=${selectedCountry}`
        );
        const data = await response.json();
        loading.style.display = 'none';

        moviesTable.style.display = 'table'; // Show table header even if no movies
        if (data.success && data.movies.length > 0) {
          renderMovies(data.movies, selectedCountry);
        } else {
          moviesTableBody.innerHTML = ''; // Ensure table body is empty
          // No alert; just show header with empty body
        }
      } catch (error) {
        loading.style.display = 'none';
        alert('Error loading movies. Please try again.');
        console.error('Error fetching movies:', error);
      }
    }

    // Render movies into the table
    function renderMovies(movies, selectedCountry) {
      moviesTableBody.innerHTML = ''; // Clear previous content
      movies.forEach(movie => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${movie.localTitle}</td>
          <td>${movie.releaseDate || 'Unknown'}</td>
          <td>${movie.trailerUrl || ''}</td>
          <td>
            <button class="update-button" onclick="toggleExpandRow(this, '${movie.localTitle}', '${movie.trailerUrl || ''}', '${selectedCountry}')">Details</button>
            <span class="action-loading" id="update-loading-${movie.localTitle}" style="display: none;">Loading...</span>
          </td>
          <td>
            <button class="delete-button" onclick="deleteMovie('${movie.localTitle}', '${selectedCountry}', this)">Delete</button>
            <span class="action-loading" id="delete-loading-${movie.localTitle}" style="display: none;">Loading...</span>
          </td>
        `;
        moviesTableBody.appendChild(row);
      });
    }

    // Delete a movie with confirmation dialog
    async function deleteMovie(title, country, button) {
      const confirmation = confirm(`Are you sure you want to delete "${title}"?`);
      if (!confirmation) return;

      const loadingIndicator = document.getElementById(`delete-loading-${title}`);
      loadingIndicator.style.display = 'inline';

      try {
        const response = await fetch(
          'https://us-central1-world-movie-trailer.cloudfunctions.net/deleteMovieByManual',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ country: country.toLowerCase(), title }),
          }
        );
        const result = await response.json();
        loadingIndicator.style.display = 'none';

        if (result.success) {
          alert(`"${title}" deleted successfully!`);
          await fetchMoviesByCountry(country); // Refresh movie list
        } else {
          alert(`Failed to delete "${title}".`);
        }
      } catch (error) {
        loadingIndicator.style.display = 'none';
        console.error('Error deleting movie:', error);
        alert('An error occurred while deleting the movie.');
      }
    }

    // Update trailer URL
    async function updateTrailer(title, country) {
      const trailerInput = document.getElementById(`trailer-${title}`);
      const newTrailerUrl = trailerInput.value;

      if (!newTrailerUrl) {
        alert('Please enter a valid trailer URL.');
        return;
      }

      const loadingIndicator = document.getElementById(`update-loading-${title}`);
      loadingIndicator.style.display = 'inline';

      try {
        const response = await fetch(
          'https://us-central1-world-movie-trailer.cloudfunctions.net/updateMovieTrailer',
          {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ country: country.toLowerCase(), title, newTrailerUrl }),
          }
        );
        const result = await response.json();
        loadingIndicator.style.display = 'none';

        if (result.success) {
          alert(`Trailer URL for "${title}" updated successfully!`);
          await fetchMoviesByCountry(country); // Refresh movie list
        } else {
          alert(`Failed to update trailer URL for "${title}".`);
        }
      } catch (error) {
        loadingIndicator.style.display = 'none';
        console.error('Error updating trailer URL:', error);
        alert('An error occurred while updating the trailer URL.');
      }
    }

    // Toggle expand row for trailer update
    function toggleExpandRow(button, title, trailerUrl, country) {
      const row = button.closest('tr');
      const nextRow = row.nextElementSibling;

      if (nextRow && nextRow.classList.contains('expand-row')) {
        nextRow.remove(); // Remove expanded row if it exists
        return;
      }

      const expandRow = document.createElement('tr');
      expandRow.className = 'expand-row';
      expandRow.innerHTML = `
        <td colspan="5">
          <label for="trailer-${title}">Trailer URL:</label>
          <input type="text" id="trailer-${title}" value="${trailerUrl}" style="width: 60%; padding: 5px;" />
          <button class="update-button" onclick="updateTrailer('${title}', '${country}')">Update Trailer</button>
        </td>
      `;
      row.after(expandRow);
    }

    // Handle country change and fetch movies
    dropdown.addEventListener('change', () => {
      const selectedCountry = dropdown.value;
      if (selectedCountry) {
        fetchMoviesByCountry(selectedCountry);
      } else {
        moviesTable.style.display = 'none';
        moviesTableBody.innerHTML = '';
      }
    });
  </script>
</body>
</html>
